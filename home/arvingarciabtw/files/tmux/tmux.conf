# To use my custom shell prompt
set -g default-command "bash --rcfile ~/.bashrc -i"

# ── General ──────────────────────────────────────────
set -g prefix C-g
unbind C-b
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g set-clipboard on
set -g focus-events on
set -g escape-time 0
set -g repeat-time 600
set -g status off

# ── No pane borders (like pane_frames false) ──────────
set -g pane-border-status off
set -g pane-border-format ""
set -g display-panes-time 3000

# ── Theme (onedark) ──────────────────────────────────
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[bg=#61afef,fg=#282c34,bold] #S #[default] "
set -g status-right "#[fg=#5c6370]#[bg=#3e4452,fg=#abb2bf] %H:%M #[default]"
setw -g window-status-current-format "#[bg=#3e4452,fg=#61afef,bold] #I:#W "
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-separator ""

set -g pane-active-border-style "fg=#727072"
set -g pane-border-style "fg=#403E41"
set -g message-style "bg=#3e4452,fg=#abb2bf"
set -g message-command-style "bg=#3e4452,fg=#abb2bf"
set -g mode-style "bg=#3e4452,fg=#abb2bf"

# ── Vim-style pane navigation (prefix + h/j/k/l) ────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits (prefix + | / -) ─────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Alt navigation (global, no prefix needed) ────────
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Window (tab) management ──────────────────────────
bind c new-window -c "#{pane_current_path}"

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind , command-prompt -p "rename window:" "rename-window '%%'"
bind x confirm-before -p "kill window? (y/n)" kill-window

# ── Pane management ──────────────────────────────────
bind f resize-pane -Z
bind d confirm-before -p "kill pane? (y/n)" kill-pane
bind p select-pane -t :.+1
bind n split-window -h -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"

# ── Resize mode (prefix + arrows, repeatable) ───────
bind -r Left resize-pane -L 1
bind -r Down resize-pane -D 1
bind -r Up resize-pane -U 1
bind -r Right resize-pane -R 1


# ── Move pane ────────────────────────────────────────
bind m command-prompt -p "swap pane to pane #:" "swap-pane -t '%%'"
bind -r J swap-pane -D
bind -r K swap-pane -U

# ── Copy mode (vi) ───────────────────────────────────
setw -g mode-keys vi
bind s copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Scroll (page up/down in copy mode) ───────────────
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down

# ── Session management ───────────────────────────────
bind o choose-tree -s
bind w choose-tree -ws

# ── Reload config ────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Popup (partial floating pane equivalent) ─────────
bind z display-popup -E
